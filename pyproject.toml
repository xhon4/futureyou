[project]
name = "futureyou"
version = "0.1.0"
description = "Reviews local Git changes against documented architecture decisions"
authors = [
    { name = "xhon4", email = "ignaciolafuente999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[openai]>=1.4.9",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
futureyou = "futureyou.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
