[project]
name = "futureyou"
version = "0.2.0"
description = "Reviews local Git changes against documented architecture decisions"
authors = [
    { name = "xhon4", email = "ignaciolafuente999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain[openai]>=1.4.9",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
futureyou = "futureyou.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E/F are the default correctness checks. I keeps the import layout stable.
# UP matches the 3.12 baseline. B flags real bug patterns (the loop closure in render).
# E501 is off because ruff format owns wrapping and cannot break every long string.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["futureyou"]
